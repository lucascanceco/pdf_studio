name: Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify merged manifest and APK metadata
        shell: bash
        run: |
          manifest=$(find app/build/intermediates/merged_manifests -name AndroidManifest.xml -print -quit)
          test -n "$manifest"
          if grep -Eq 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)' "$manifest"; then
            echo 'Unexpected network permissions in merged manifest'
            exit 1
          fi
          echo 'Network permissions absent from merged manifest'
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PDFStudio-debug
          path: app/build/outputs/apk/debug/app-debug.apk
